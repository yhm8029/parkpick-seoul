name: Bootstrap repository source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/small-* | base64 --decode > /tmp/parkpick-source.tar.gz
          mkdir -p /tmp/parkpick-source
          tar -xzf /tmp/parkpick-source.tar.gz -C /tmp/parkpick-source

      - name: Replace bootstrap files with project source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-import.yml /tmp/bootstrap-import.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/parkpick-source/. .
          rm -f .github/workflows/ci.yml
          mkdir -p .github/workflows
          cp /tmp/bootstrap-import.yml .github/workflows/bootstrap-import.yml
          git config user.name "HyunM"
          git config user.email "141546495+yhm8029@users.noreply.github.com"
          git add -A
          git commit -m "feat: scaffold GPS parking PWA with Kakao and Naver maps"
          git push origin HEAD:main
