name: Bootstrap repository source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/small-* | base64 --decode > /tmp/parkpick-source.tar.gz
          mkdir -p /tmp/parkpick-source
          tar -xzf /tmp/parkpick-source.tar.gz -C /tmp/parkpick-source

      - name: Replace bootstrap branch with project source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/parkpick-source
          git init -b main
          git config user.name "HyunM"
          git config user.email "141546495+yhm8029@users.noreply.github.com"
          git add -A
          git commit -m "feat: scaffold GPS parking PWA with Kakao and Naver maps"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
